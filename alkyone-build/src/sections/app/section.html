<section id="app" class="sec" data-theme="mist-teal" aria-labelledby="app-title">
  <svg class="app-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="app-i-live" viewBox="0 0 24 24"><path d="M2.5 12.5h4.2l2.3-6 3.4 11.5 2.6-8 1.6 2.5h5"/></symbol>
      <symbol id="app-i-sleep" viewBox="0 0 24 24"><circle cx="5.5" cy="6" r="1.6"/><circle cx="5.5" cy="12" r="1.6"/><circle cx="5.5" cy="18" r="1.6"/><path d="M10.5 6h9M10.5 12h6M10.5 18h9"/></symbol>
      <symbol id="app-i-alerts" viewBox="0 0 24 24"><path d="M6 16.5v-5a6 6 0 0 1 12 0v5l1.6 2H4.4z"/><path d="M10 21a2 2 0 0 0 4 0"/></symbol>
      <symbol id="app-i-log" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4.5"/><path d="M12 8.5v7M8.5 12h7"/></symbol>
      <symbol id="app-i-patch" viewBox="0 0 24 24"><rect x="2.8" y="7.5" width="18.4" height="9" rx="4.5"/><circle cx="8.4" cy="12" r="1.3"/><path d="M13 12h5"/></symbol>
      <symbol id="app-i-hand" viewBox="0 0 24 24"><path d="M8.2 12.4V5.6a1.4 1.4 0 0 1 2.8 0v5.2"/><path d="M11 10.6V4.4a1.4 1.4 0 0 1 2.8 0v6.2"/><path d="M13.8 10.8V5.4a1.4 1.4 0 0 1 2.8 0v6.8"/><path d="M16.6 9.4a1.4 1.4 0 0 1 2.8 0v5.6c0 3.7-2.6 6-6 6h-.5c-2.4 0-3.8-1-5-2.7l-3-4.3a1.4 1.4 0 0 1 2.2-1.7l1.7 1.9"/></symbol>
      <symbol id="app-i-feeding" viewBox="0 0 24 24"><ellipse cx="12" cy="8" rx="3.4" ry="4.8"/><path d="M12 12.8V21"/></symbol>
      <symbol id="app-i-diaper" viewBox="0 0 24 24"><path d="M3.5 6.5h17V11c0 4.7-3.6 8-8.5 8s-8.5-3.3-8.5-8z"/><path d="M3.5 10.5c3 1.6 6 2.4 8.5 2.4s5.500-.8 8.500-2.400"/></symbol>
      <symbol id="app-i-sstart" viewBox="0 0 24 24"><path d="M3.5 18h17M7 18a5 5 0 0 1 10 0"/><path d="M12 3.5v6M9.5 7.2l2.500 2.500 2.500-2.500"/></symbol>
      <symbol id="app-i-sstop" viewBox="0 0 24 24"><path d="M3.5 18h17M7 18a5 5 0 0 1 10 0"/><path d="M12 9.500v-6M9.500 5.800 12 3.300l2.500 2.500"/></symbol>
      <symbol id="app-i-med" viewBox="0 0 24 24"><rect x="2.8" y="8.6" width="18.400" height="6.800" rx="3.400" transform="rotate(-40 12 12)"/><path d="m9.300 14.300 5.400-4.600" /></symbol>
      <symbol id="app-i-note" viewBox="0 0 24 24"><path d="M6 3.800h9l3.500 3.500V20.200H6z"/><path d="M9 11h6M9 14.500h6"/></symbol>
      <symbol id="app-i-check" viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></symbol>
      <symbol id="app-i-pos" viewBox="0 0 24 24"><rect x="4" y="9" width="16" height="6.500" rx="3.250"/><path d="M4 19.500h16"/></symbol>
      <symbol id="app-i-link" viewBox="0 0 24 24"><path d="M8.500 8.500a5 5 0 0 1 7 0M6 6a8.500 8.500 0 0 1 12 0"/><circle cx="12" cy="13" r="1.300"/><path d="M12 14.500v4"/></symbol>
      <symbol id="app-i-temp" viewBox="0 0 24 24"><path d="M10 14.200V5a2 2 0 0 1 4 0v9.200a4 4 0 1 1-4 0z"/></symbol>
      <symbol id="app-i-o2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.500 12.500a3.500 3.500 0 0 0 7 0"/></symbol>
      <symbol id="app-i-x" viewBox="0 0 24 24"><path d="m6.500 6.500 11 11M17.500 6.500l-11 11"/></symbol>
    </defs>
  </svg>

  <div class="container sec__grid">
    <div class="sec__head">
      <p class="eyebrow" data-reveal><span class="eyebrow__num">4</span> <span class="eyebrow__text">The app</span></p>
      <h2 class="h2" id="app-title" data-reveal="lines">Everything in one calm place.</h2>
      <p class="lede" data-reveal data-reveal-delay="1">Swipe through four screens. Add your own notes and watch them land on the timeline beside the sensor data.</p>
      <ol class="app-steps" data-reveal data-reveal-delay="2">
        <li><span class="app-steps__n" aria-hidden="true">1</span><span>Swipe the screen, or use the tabs under it.</span></li>
        <li><span class="app-steps__n" aria-hidden="true">2</span><span>In <strong>Log</strong>, tap a tile to add an entry.</span></li>
        <li><span class="app-steps__n" aria-hidden="true">3</span><span>Open <strong>Sleep</strong> to see it beside the sensor data.</span></li>
      </ol>
    </div>

    <figure class="plate sec__visual" data-reveal>
      <div class="plate__stage app-stage" id="app-stage">
        <div class="app-tilt" id="app-tilt">
          <div class="app-device" id="app-device">
            <span class="app-sbtn app-sbtn--l1" aria-hidden="true"></span>
            <span class="app-sbtn app-sbtn--l2" aria-hidden="true"></span>
            <span class="app-sbtn app-sbtn--l3" aria-hidden="true"></span>
            <span class="app-sbtn app-sbtn--r1" aria-hidden="true"></span>
            <div class="app-frame">
              <div class="app-bezel">
                <div class="app-screen" role="group" aria-label="Phone screen: the Alkyone app, simulated">
                  <div class="app-status" aria-hidden="true">
                    <span class="app-time">02:14</span>
                    <span class="app-hole"></span>
                    <span class="app-sys">
                      <svg viewBox="0 0 18 12" width="16" height="11" focusable="false"><path d="M1 10.500v-1.500M5 10.500v-3.500M9 10.500v-5.500M13 10.500v-7.500" /></svg>
                      <svg viewBox="0 0 26 12" width="23" height="11" focusable="false"><rect x=".5" y="1.500" width="21" height="9" rx="3"/><rect x="2.500" y="3.500" width="14" height="5" rx="1.500" class="app-batt"/><path d="M23.500 4.500v3"/></svg>
                    </span>
                  </div>

                  <div class="app-body">
                    <div class="app-tabs" role="tablist" aria-label="App screens" id="app-tabs">
                      <button type="button" role="tab" id="app-tab-live" class="app-tab" aria-selected="true" aria-controls="app-panel-live" tabindex="0"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-live"/></svg><span>Live</span></button>
                      <button type="button" role="tab" id="app-tab-sleep" class="app-tab" aria-selected="false" aria-controls="app-panel-sleep" tabindex="-1"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-sleep"/></svg><span>Sleep</span></button>
                      <button type="button" role="tab" id="app-tab-alerts" class="app-tab" aria-selected="false" aria-controls="app-panel-alerts" tabindex="-1"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-alerts"/></svg><span>Alerts</span></button>
                      <button type="button" role="tab" id="app-tab-log" class="app-tab" aria-selected="false" aria-controls="app-panel-log" tabindex="-1"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-log"/></svg><span>Log</span></button>
                      <span class="app-ind" id="app-ind" aria-hidden="true"></span>
                    </div>

                    <div class="app-track" id="app-track">
                      <!-- 1 LIVE -->
                      <div role="tabpanel" id="app-panel-live" class="app-panel" aria-labelledby="app-tab-live" tabindex="0">
                        <header class="app-phead"><h3 class="app-ptitle">Live</h3><span class="sim-tag"></span></header>
                        <p class="app-linkrow"><span class="app-dot" aria-hidden="true"></span>Patch linked · skin contact</p>
                        <div class="app-hr">
                          <p class="app-label">Heart rate</p>
                          <p class="app-hr__row"><span class="app-hr__num" id="app-hr">128</span><span class="app-hr__unit" aria-hidden="true">bpm</span><span class="sr-only">beats per minute</span></p>
                          <canvas class="app-wave" id="app-wave" aria-hidden="true"></canvas>
                        </div>
                        <div class="app-tiles">
                          <div class="app-tile"><p class="app-label"><button type="button" class="term" data-term="spo2">SpO<sub>2</sub></button></p><p class="app-tile__val"><span id="app-spo2">97</span><span class="app-tile__unit">%</span></p></div>
                          <div class="app-tile"><p class="app-label">Skin temperature</p><p class="app-tile__val"><span id="app-temp">36.4</span><span class="app-tile__unit">°C</span></p></div>
                        </div>
                        <ul class="app-chips" aria-label="Status">
                          <li class="app-chip"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-pos"/></svg>On back</li>
                          <li class="app-chip"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-check"/></svg>No alerts</li>
                        </ul>
                      </div>

                      <!-- 2 SLEEP -->
                      <div role="tabpanel" id="app-panel-sleep" class="app-panel" aria-labelledby="app-tab-sleep" tabindex="-1" inert>
                        <header class="app-phead"><h3 class="app-ptitle">Tonight so far</h3><span class="sim-tag"></span></header>
                        <p class="app-sub">Simulated clock: 02:14</p>
                        <div class="app-strip" id="app-strip" role="img" aria-label="Overview of tonight from 20:30 to 02:14: blocks of asleep and awake, with your own entries marked by dots."></div>
                        <div class="app-strip__axis" aria-hidden="true"><span>20:30</span><span>02:14</span></div>
                        <ul class="app-legend" aria-hidden="true"><li><i class="app-key app-key--asleep"></i>Asleep</li><li><i class="app-key app-key--awake"></i>Awake</li><li><i class="app-key app-key--you"></i>You</li></ul>
                        <h4 class="app-h4">Timeline <span class="app-h4__aside">latest first</span></h4>
                        <ol class="app-timeline" id="app-timeline" aria-label="Tonight, latest first"></ol>
                        <p class="app-nojs">The timeline is drawn by script and needs JavaScript.</p>
                      </div>

                      <!-- 3 ALERTS -->
                      <div role="tabpanel" id="app-panel-alerts" class="app-panel" aria-labelledby="app-tab-alerts" tabindex="-1" inert>
                        <header class="app-phead"><h3 class="app-ptitle">Alerts</h3><span class="sim-tag"></span></header>
                        <p class="app-sub">Tonight so far, latest first</p>
                        <ul class="app-alerts">
                          <li class="app-alert app-alert--attn">
                            <p class="app-alert__top"><span class="app-alert__type">Needs attention</span><span class="app-alert__time">01:05</span></p>
                            <p class="app-alert__what">Patch lost skin contact</p>
                            <p class="app-alert__ack"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-check"/></svg>Acknowledged 01:06</p>
                          </li>
                          <li class="app-alert app-alert--lost">
                            <p class="app-alert__top"><span class="app-alert__type">Signal lost</span><span class="app-alert__time">23:48</span></p>
                            <p class="app-alert__what">No heartbeat from the patch</p>
                            <p class="app-alert__ack"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-check"/></svg>Acknowledged 23:49</p>
                          </li>
                          <li class="app-alert">
                            <p class="app-alert__top"><span class="app-alert__type">Routine</span><span class="app-alert__time">23:30</span></p>
                            <p class="app-alert__what">Position changed</p>
                            <p class="app-alert__ack"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-check"/></svg>Acknowledged 23:30</p>
                          </li>
                          <li class="app-alert">
                            <p class="app-alert__top"><span class="app-alert__type">Routine</span><span class="app-alert__time">21:35</span></p>
                            <p class="app-alert__what">Position changed</p>
                            <p class="app-alert__ack"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-check"/></svg>Acknowledged 21:36</p>
                          </li>
                        </ul>
                        <p class="app-note">Silence is treated as an alert, so a lost signal is listed here too.</p>
                      </div>

                      <!-- 4 LOG -->
                      <div role="tabpanel" id="app-panel-log" class="app-panel" aria-labelledby="app-tab-log" tabindex="-1" inert>
                        <header class="app-phead"><h3 class="app-ptitle">Log</h3><span class="sim-tag"></span></header>
                        <div id="app-picker">
                          <p class="app-sub">Add an entry by hand</p>
                          <div class="app-logtiles">
                            <button type="button" class="app-logtile" data-kind="feeding"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-feeding"/></svg><span>Feeding</span></button>
                            <button type="button" class="app-logtile" data-kind="diaper"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-diaper"/></svg><span>Diaper change</span></button>
                            <button type="button" class="app-logtile" data-kind="sstart"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-sstart"/></svg><span>Sleep start</span></button>
                            <button type="button" class="app-logtile" data-kind="sstop"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-sstop"/></svg><span>Sleep stop</span></button>
                            <button type="button" class="app-logtile" data-kind="med"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-med"/></svg><span>Medication</span></button>
                            <button type="button" class="app-logtile" data-kind="note"><svg class="app-ico" aria-hidden="true" focusable="false"><use href="#app-i-note"/></svg><span>Note</span></button>
                          </div>
                        </div>
                        <form class="app-form" id="app-form" hidden novalidate>
                          <h4 class="app-form__title" id="app-form-title" tabindex="-1">Feeding</h4>
                          <div class="app-field">
                            <label for="app-f-time">Time</label>
                            <input type="time" id="app-f-time" name="time" required value="02:14">
                          </div>
                          <div class="app-field">
                            <label for="app-f-text" id="app-f-label">Note (optional)</label>
                            <input type="text" id="app-f-text" name="text" maxlength="80" autocomplete="off" enterkeyhint="done">
                            <p class="app-field__hint" id="app-f-hint" hidden></p>
                          </div>
                          <p class="app-form__err" id="app-f-err" role="alert" hidden></p>
                          <div class="app-form__btns">
                            <button type="submit" class="app-btn app-btn--add">Add</button>
                            <button type="button" class="app-btn app-btn--cancel" id="app-f-cancel">Cancel</button>
                          </div>
                        </form>
                        <div class="app-recent">
                          <div class="app-recent__head">
                            <h4 class="app-h4" id="app-recent-title" tabindex="-1">Recent entries</h4>
                            <button type="button" class="app-textbtn" id="app-viewtl">View timeline</button>
                          </div>
                          <ul class="app-recent__list" id="app-recent" aria-labelledby="app-recent-title"></ul>
                          <p class="app-recent__empty" id="app-recent-empty" hidden>Nothing added yet.</p>
                        </div>
                        <div class="app-reset"><button type="button" class="app-textbtn" id="app-reset">Reset demo</button></div>
                      </div>
                    </div>
                    <p class="app-toast" id="app-toast" role="status" aria-live="polite"></p>
                  </div>

                  <span class="app-home" aria-hidden="true"></span>
                  <span class="app-glare" aria-hidden="true"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <span class="app-floor" aria-hidden="true"></span>
      </div>
      <figcaption class="plate__caption"><span class="plate__fig">Fig. 3</span> All values and entries are simulated.</figcaption>
    </figure>
  </div>
</section>
